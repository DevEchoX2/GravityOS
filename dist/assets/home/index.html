<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home - gravityOS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-color: transparent;
            --text-color: white;
            --accent-color: #3b82f6;
        }
        body {
            margin: 0;
            padding: 40px;
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            transition: color 0.3s;
        }
        h1 {
            font-size: 5rem;
            margin-bottom: 15px;
            font-weight: 800;
            letter-spacing: -0.04em;
            background: linear-gradient(to right, var(--accent-color), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.25rem;
            opacity: 0.6;
            max-width: 600px;
            line-height: 1.6;
        }
        .shortcuts {
            margin-top: 50px;
            display: flex;
            gap: 25px;
        }
        .shortcut {
            width: 64px;
            height: 64px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }
        .shortcut:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
    </style>
</head>
<body>
    <h1>gravityOS</h1>
    <p>The next generation web proxy and OS experience. Fast, secure, and highly customizable.</p>
    
    <div class="shortcuts">
        <div class="shortcut" title="Discord" onclick="window.parent.loadProxy('https://discord.com')">

        </div>
        <div class="shortcut" title="Instagram" onclick="window.parent.loadProxy('https://instagram.com')">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>

        <div class="shortcut" title="YouTube" onclick="window.parent.loadProxy('https://youtube.com')">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.42a2.78 2.78 0 0 0-1.94 2C1 8.14 1 12 1 12s0 3.86.42 5.58a2.78 2.78 0 0 0 1.94 2c1.71.42 8.6.42 8.6.42s6.88 0 8.6-.42a2.78 2.78 0 0 0 1.94-2C23 15.86 23 12 23 12s0-3.86-.42-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/></svg>
        </div>
    </div>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('gravity_theme');
            if (savedTheme) {
                try {
                    const theme = JSON.parse(savedTheme);
                    for (const [key, value] of Object.entries(theme.colors)) {
                        document.documentElement.style.setProperty(`--${key}`, value);
                    }
                } catch (e) {
                    console.error('Failed to apply initial theme to home:', e);
                }
            }
        })();

        window.addEventListener('message', (event) => {
            if (event.data.type === 'themeChange') {
                const colors = event.data.theme;
                for (const [key, value] of Object.entries(colors)) {
                    document.documentElement.style.setProperty(`--${key}`, value);
                }
            }
        });
    </script>
    <script src="main.js"></script>
</body>
</html>
