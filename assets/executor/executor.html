<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Executor - gravityOS</title>
    <link rel="stylesheet" href="executor.css">
</head>
<body>
    <div class="container">
        <h1>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
            EXE (WASM) Executor
        </h1>
        <p style="margin:0; opacity:0.7; font-size:0.9rem;">Paste your code below or upload a .wasm / .exe file to execute in a secure sandbox.</p>
        
        <textarea id="code-area" placeholder="// Paste your code or WASM hex here..."></textarea>
        
        <div class="controls">
            <select id="lang-select">
                <option value="js">JavaScript</option>
                <option value="lua">Lua (Roblox)</option>
                <option value="wasm">WASM (Hex)</option>
            </select>
            <select id="hub-select" onchange="loadFromHub(this)">
                <option value="">Script Hub...</option>
                <optgroup label="Blooket">
                    <option value="Blooket:Global Hack (glixzzy)">Global Hack (glixzzy)</option>
                    <option value="Blooket:All Blooks (Client-side)">All Blooks (Client-side)</option>
                </optgroup>
                <optgroup label="Kahoot">
                    <option value="Kahoot:Kahoot Winner (theusaf)">Kahoot Winner (theusaf)</option>
                </optgroup>
                <optgroup label="Edpuzzle">
                    <option value="Edpuzzle:Edpuzzle Master">Edpuzzle Master</option>
                </optgroup>
            </select>
            <button onclick="execute()">Run Code</button>
            <button class="secondary" onclick="copyCode()">Copy Code</button>
            <button class="secondary" onclick="document.getElementById('file-input').click()">Upload File</button>
            <input type="file" id="file-input" class="file-input" onchange="handleFile(this)">
        </div>
        
        <div class="status" id="status">Ready.</div>
    </div>

    <script type="module">
        import { executeCode } from './executor.js';
        import { ScriptHub } from './script-hub.js';

        window.loadFromHub = function(select) {
            if (!select.value) return;
            const [cat, name] = select.value.split(':');
            const item = ScriptHub[cat][name];
            document.getElementById('code-area').value = item.code;
            document.getElementById('lang-select').value = 'js';
            document.getElementById('status').innerText = `Loaded ${name}. Click "Run Code" to open ${item.url} and execute loader.`;
        };

        window.copyCode = function() {
            const code = document.getElementById('code-area').value;
            navigator.clipboard.writeText(code);
            document.getElementById('status').innerText = "Code copied to clipboard!";
        };

        (function() {
            const savedTheme = localStorage.getItem('gravity_theme');
            if (savedTheme) {
                try {
                    const theme = JSON.parse(savedTheme);
                    if (theme && theme.colors) {
                        for (const [key, value] of Object.entries(theme.colors)) {
                            document.documentElement.style.setProperty(`--${key}`, value);
                        }
                    }
                } catch (e) {
                    console.error('Failed to apply initial theme to executor:', e);
                }
            }
        })();

        window.addEventListener('message', (event) => {
            if (event.data.type === 'themeChange') {
                const colors = event.data.theme;
                if (colors) {
                    for (const [key, value] of Object.entries(colors)) {
                        document.documentElement.style.setProperty(`--${key}`, value);
                    }
                }
            }
        });

        let currentFileBuffer = null;

        window.execute = async function() {
            const codeArea = document.getElementById('code-area');
            const status = document.getElementById('status');
            const langSelect = document.getElementById('lang-select');
            const code = codeArea.value;
            
            if (!code.trim() && !currentFileBuffer) {
                status.innerText = "Error: No code or file provided.";
                return;
            }

            status.innerText = "Executing...";
            
            let result;
            if (currentFileBuffer) {
                result = await executeCode(currentFileBuffer, 'wasm');
            } else {
                result = await executeCode(code, langSelect.value);
            }

            if (result.success) {
                status.innerText = `Success!\n${result.logs ? 'Logs:\n' + result.logs + '\n' : ''}Result: ${result.result}`;
            } else {
                status.innerText = `Error: ${result.error}${result.logs ? '\nLogs:\n' + result.logs : ''}`;
            }
        }

        window.handleFile = function(input) {
            const file = input.files[0];
            const status = document.getElementById('status');
            const codeArea = document.getElementById('code-area');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentFileBuffer = new Uint8Array(e.target.result);
                    status.innerText = `File loaded: ${file.name} (${file.size} bytes). Ready to execute.`;
                    codeArea.value = `// Binary file: ${file.name}\n// Ready for execution...`;
                };
                reader.readAsArrayBuffer(file);
            }
        }
    </script>
</body>
</html>
