<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Browser - gravityOS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');
        :root {
            --browser-bg: #000;
            --browser-text: #fff;
            --browser-accent: #3b82f6;
            --nav-bg: #000;
            --input-bg: rgba(255, 255, 255, 0.05);
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--browser-bg);
            color: var(--browser-text);
            font-family: 'Inter', -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #browser-header {
            background: var(--nav-bg);
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
        }
        .tab-bar {
            height: 40px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 5px;
            background: #000;
        }
        .browser-tabs {
            display: flex;
            gap: 4px;
            flex: 1;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .browser-tabs::-webkit-scrollbar { display: none; }
        
        .browser-tab {
            height: 32px;
            padding: 0 12px;
            background: transparent;
            border-radius: 8px 8px 0 0;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 120px;
            max-width: 200px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            position: relative;
            border-top: 2px solid transparent;
        }
        .browser-tab.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border-top: 2px solid #fff;
        }
        .tab-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tab-close {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-size: 10px;
            opacity: 0;
        }
        .browser-tab:hover .tab-close {
            opacity: 0.5;
        }
        .tab-close:hover {
            background: rgba(255, 255, 255, 0.1);
            opacity: 1;
        }
        .add-tab {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 6px;
            font-size: 18px;
            opacity: 0.6;
        }
        .add-tab:hover {
            background: rgba(255, 255, 255, 0.05);
            opacity: 1;
        }

        #nav-bar {
            height: 48px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 15px;
            background: #000;
        }
        .nav-controls {
            display: flex;
            gap: 15px;
        }
        .nav-btn {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .nav-btn:hover {
            opacity: 1;
        }
        #url-bar-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #url-bar {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 15px;
            border-radius: 8px;
            outline: none;
            font-size: 13px;
            transition: all 0.2s;
        }
        #url-bar:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .search-engine-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }
        .menu-btn {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0.6;
        }

        #settings-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            z-index: 2000;
            width: 300px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            color: #fff;
        }
        .settings-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .settings-group label {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
        }
        .settings-group select, .settings-group input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
        }
        .settings-btn {
            background: var(--browser-accent);
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="browser-header">
        <div class="tab-bar">
            <div class="browser-tabs" id="tabs-container">
                <div class="add-tab" onclick="createNewTab()">+</div>
            </div>
        </div>
        <div id="nav-bar">
            <div class="nav-controls">
                <div class="nav-btn" title="Back" onclick="goBack()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </div>
                <div class="nav-btn" title="Forward" onclick="goForward()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </div>
                <div class="nav-btn" title="Reload" onclick="reloadTab()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                </div>
            </div>
            <div id="url-bar-container">
                <select id="search-engine" class="search-engine-select">
                    <option value="google">Google</option>
                    <option value="duckduckgo" selected>DuckDuckGo</option>
                    <option value="brave">Brave</option>
                    <option value="bing">Bing</option>
                </select>
                <input type="text" id="url-bar" placeholder="Search or enter address" autocomplete="off">
            </div>
            <div class="menu-btn" onclick="toggleMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
            </div>
        </div>
    </div>
    <div id="viewports-container" style="flex:1; position:relative;"></div>

    <div id="browser-menu" style="display:none; position:absolute; right:15px; top:95px; background:rgba(20, 20, 20, 0.95); backdrop-filter:blur(20px); border:1px solid rgba(255, 255, 255, 0.1); border-radius:12px; padding:8px; z-index:1000; width:200px; box-shadow:0 10px 30px rgba(0,0,0,0.5);">
        <div style="padding:10px 15px; cursor:pointer; font-size:13px; border-radius:8px;" onmouseover="this.style.background='rgba(255,255,255,0.05)'" onmouseout="this.style.background='transparent'" onclick="window.parent.loadPage('extensions')">Manage Extensions</div>
        <div style="padding:10px 15px; cursor:pointer; font-size:13px; border-radius:8px;" onmouseover="this.style.background='rgba(255,255,255,0.05)'" onmouseout="this.style.background='transparent'" onclick="alert('EXE support coming soon!')">Run .EXE</div>
        <div style="padding:10px 15px; cursor:pointer; font-size:13px; border-radius:8px;" onmouseover="this.style.background='rgba(255,255,255,0.05)'" onmouseout="this.style.background='transparent'" onclick="openSettings()">Proxy Settings</div>
        <div style="height:1px; background:rgba(255,255,255,0.05); margin:5px 0;"></div>
        <div style="padding:10px 15px; cursor:pointer; font-size:13px; border-radius:8px; color:#ff4444;" onmouseover="this.style.background='rgba(255,0,0,0.05)'" onmouseout="this.style.background='transparent'" onclick="location.reload()">Clear Cache</div>
    </div>

    <div id="settings-modal">
        <h3 style="margin-top:0; margin-bottom:15px; font-weight:600;">Proxy Config</h3>
        <div class="settings-group">
            <label>Engine</label>
            <select id="setting-engine">
                <option value="uv">Ultraviolet</option>
                <option value="scramjet">Scramjet (IXL)</option>
            </select>
        </div>
        <div class="settings-group">
            <label>BareMux Transport</label>
            <select id="setting-transport">
                <option value="epoxy">Epoxy</option>
                <option value="libcurl">Libcurl</option>
            </select>
        </div>
        <div class="settings-group">
            <label>Wisp Server (WSS)</label>
            <input type="text" id="setting-wisp" value="wss://wisp.rhw.one/">
        </div>
        <button class="settings-btn" onclick="saveSettings()">Save & Restart Engines</button>
        <button class="settings-btn" style="background:transparent; border:1px solid rgba(255,255,255,0.1); margin-top:5px;" onclick="closeSettings()">Cancel</button>
    </div>

    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.config.js"></script>
    <script src="/ixlmath/baremux/index.js"></script>
    <script src="/ixlmath/scram/scramjet.all.js"></script>
    
    <script>
        let tabs = [];
        let activeTabId = null;
        let enginesReady = false;
        let scramjetCtrl = null;

        let gravityConfig = {
            engine: localStorage.getItem('gravity_engine') || 'uv',
            transport: localStorage.getItem('gravity_transport') || 'epoxy',
            wisp: localStorage.getItem('gravity_wisp') || 'wss://wisp.rhw.one/'
        };

        async function initProxyEngines() {
            enginesReady = false;

            try {
                if ('serviceWorker' in navigator) {
                    if (gravityConfig.engine === 'uv' && window.__uv$config) {
                        await navigator.serviceWorker.register('/uv/sw.js', { scope: __uv$config.prefix });
                    } else if (gravityConfig.engine === 'scramjet') {
                        await navigator.serviceWorker.register('/ixlmath/sw.js', { scope: '/ixlmath/go/' });
                    }
                }
            } catch (e) {
                console.error(e);
            }

            if (window.BareMux) {
                try {
                    const conn = new BareMux.BareMuxConnection("/ixlmath/baremux/worker.js");
                    const transportPath = gravityConfig.transport === 'epoxy' 
                        ? "/ixlmath/epoxy/index.mjs" 
                        : "/ixlmath/libcurl/index.mjs";
                        
                    await conn.setTransport(transportPath, [{ websocket: gravityConfig.wisp }]);
                } catch (e) {
                    console.error(e);
                }
            }

            if (gravityConfig.engine === 'scramjet') {
                const attemptScramjetInit = (retries = 20) => {
                    if (window.$scramjetLoadController) {
                        const { ScramjetController } = window.$scramjetLoadController();
                        scramjetCtrl = new ScramjetController({
                            files: { 
                                all: "/ixlmath/scram/scramjet.all.js", 
                                wasm: "/ixlmath/scram/scramjet.wasm.wasm", 
                                sync: "/ixlmath/scram/scramjet.sync.js" 
                            },
                            prefix: "/ixlmath/go/" 
                        });
                        scramjetCtrl.init();
                        enginesReady = true;
                        checkPendingLoad();
                    } else if (retries > 0) {
                        setTimeout(() => attemptScramjetInit(retries - 1), 250);
                    } else {
                        console.error("Scramjet script failed to load entirely.");
                        enginesReady = true; 
                        checkPendingLoad();
                    }
                };
                attemptScramjetInit();
            } else {
                enginesReady = true;
                checkPendingLoad();
            }
        }

        function checkPendingLoad() {
            const titleEl = document.querySelector(`#tab-${activeTabId} .tab-title`);
            if (titleEl && titleEl.innerText === 'Starting engine...') {
                launchProxy();
            }
        }

        function openSettings() {
            document.getElementById('browser-menu').style.display = 'none';
            document.getElementById('setting-engine').value = gravityConfig.engine;
            document.getElementById('setting-transport').value = gravityConfig.transport;
            document.getElementById('setting-wisp').value = gravityConfig.wisp;
            document.getElementById('settings-modal').style.display = 'block';
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        async function saveSettings() {
            gravityConfig.engine = document.getElementById('setting-engine').value;
            gravityConfig.transport = document.getElementById('setting-transport').value;
            gravityConfig.wisp = document.getElementById('setting-wisp').value;
            
            localStorage.setItem('gravity_engine', gravityConfig.engine);
            localStorage.setItem('gravity_transport', gravityConfig.transport);
            localStorage.setItem('gravity_wisp', gravityConfig.wisp);
            
            closeSettings();
            await initProxyEngines();
            
            const url = document.getElementById('url-bar').value;
            if(url && !url.includes('newtab.html')) {
                launchProxy();
            }
        }

        function createNewTab(url = 'newtab.html') {
            const id = Date.now().toString();
            const tab = { id: id, url: url, title: 'New Tab' };
            tabs.push(tab);
            
            const tabEl = document.createElement('div');
            tabEl.className = 'browser-tab';
            tabEl.id = `tab-${id}`;
            tabEl.innerHTML = `
                <span class="tab-title">New Tab</span>
                <span class="tab-close" onclick="closeTab(event, '${id}')">×</span>
            `;
            tabEl.onclick = () => switchTab(id);
            
            const container = document.getElementById('tabs-container');
            container.insertBefore(tabEl, container.lastElementChild);
            
            const viewport = document.createElement('iframe');
            viewport.id = `viewport-${id}`;
            viewport.className = 'browser-viewport';
            viewport.style.cssText = 'width:100%; height:100%; border:none; display:none; position:absolute; top:0; left:0; background:white;';
            viewport.src = url;
            viewport.onload = () => {
                injectExtensions(viewport);
                updateTabTitle(id, viewport);
            };
            
            document.getElementById('viewports-container').appendChild(viewport);
            switchTab(id);
        }

        function switchTab(id) {
            activeTabId = id;
            document.querySelectorAll('.browser-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('iframe').forEach(v => v.style.display = 'none');
            
            const activeTab = document.getElementById(`tab-${id}`);
            const activeViewport = document.getElementById(`viewport-${id}`);
            
            if (activeTab) activeTab.classList.add('active');
            if (activeViewport) {
                activeViewport.style.display = 'block';
                const url = activeViewport.src;
                document.getElementById('url-bar').value = (url.includes('newtab.html') || url === 'about:blank') ? '' : url;
            }
        }

        function closeTab(e, id) {
            e.stopPropagation();
            if (tabs.length === 1) return;
            
            const index = tabs.findIndex(t => t.id === id);
            tabs.splice(index, 1);
            
            document.getElementById(`tab-${id}`).remove();
            document.getElementById(`viewport-${id}`).remove();
            
            if (activeTabId === id) {
                switchTab(tabs[Math.max(0, index - 1)].id);
            }
        }

        function updateTabTitle(id, iframe) {
            try {
                const title = iframe.contentDocument.title || 'New Tab';
                const titleEl = document.querySelector(`#tab-${id} .tab-title`);
                if (titleEl) titleEl.innerText = title;
            } catch (e) {}
        }

        function launchProxy() {
            const url = document.getElementById('url-bar').value;
            if (!url) return;
            
            if (url.startsWith('javascript:')) {
                const code = url.slice(11);
                const viewport = document.getElementById(`viewport-${activeTabId}`);
                if (viewport) {
                    try { viewport.contentWindow.eval(decodeURIComponent(code)); } 
                    catch (e) {}
                }
                return;
            }

            if (!enginesReady) {
                document.querySelector(`#tab-${activeTabId} .tab-title`).innerText = 'Starting engine...';
                return;
            }
            
            let targetUrl = url;
            if (!url.startsWith('http')) {
                const engine = document.getElementById('search-engine').value;
                const engines = {
                    google: 'https://www.google.com/search?q=',
                    duckduckgo: 'https://duckduckgo.com/?q=',
                    brave: 'https://search.brave.com/search?q=',
                    bing: 'https://www.bing.com/search?q='
                };
                targetUrl = (engines[engine] || engines.google) + encodeURIComponent(url);
            }
            
            let encodedUrl = targetUrl;
            
            if (gravityConfig.engine === 'uv' && window.__uv$config) {
                encodedUrl = __uv$config.prefix + __uv$config.encodeUrl(targetUrl);
            } else if (gravityConfig.engine === 'scramjet' && scramjetCtrl) {
                encodedUrl = scramjetCtrl.encodeUrl(targetUrl);
            } else if (gravityConfig.engine === 'scramjet' && !scramjetCtrl) {
                alert("Scramjet Engine failed to load properly. Switch to Ultraviolet in Proxy Settings.");
                return;
            }
            
            const viewport = document.getElementById(`viewport-${activeTabId}`);
            if (viewport) {
                viewport.src = encodedUrl;
                document.querySelector(`#tab-${activeTabId} .tab-title`).innerText = 'Loading...';
            }
        }

        function goBack() {
            const viewport = document.getElementById(`viewport-${activeTabId}`);
            if (viewport) viewport.contentWindow.history.back();
        }

        function goForward() {
            const viewport = document.getElementById(`viewport-${activeTabId}`);
            if (viewport) viewport.contentWindow.history.forward();
        }

        function reloadTab() {
            const viewport = document.getElementById(`viewport-${activeTabId}`);
            if (viewport) viewport.contentWindow.location.reload();
        }

        function toggleMenu() {
            const menu = document.getElementById('browser-menu');
            menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
        }

        function injectExtensions(iframe) {
            const extensions = JSON.parse(localStorage.getItem('gravity_extensions') || '[]');
            extensions.forEach(ext => {
                if (ext.enabled) {
                    try {
                        const script = iframe.contentDocument.createElement('script');
                        script.textContent = ext.code;
                        iframe.contentDocument.body.appendChild(script);
                    } catch (e) {}
                }
            });
        }

        window.addEventListener('message', (event) => {
            if (event.data.type === 'loadUrl') {
                document.getElementById('url-bar').value = event.data.url;
                launchProxy();
            }
        });

        document.getElementById('url-bar').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') launchProxy();
        });

        initProxyEngines();
        createNewTab();
    </script>
</body>
</html>
