<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script id="aclib" type="text/javascript" src="https://acscdn.com/script/aclib.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PFE26JMWNJ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-PFE26JMWNJ');
    </script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --accent-color: #3b82f6;
            --text-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --transition-speed: 0.2s;
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', 'Geist', -apple-system, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s ease;
        }

        .gametainer {
            max-width: 1400px;
            margin: 0 auto;
            padding: 80px 24px;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .search-sec {
            margin-bottom: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .prov-sel {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .prov-btn {
            background: transparent;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            transition: all var(--transition-speed);
            font-weight: 500;
        }

        .prov-btn:hover {
            color: #fff;
        }

        .prov-btn.active {
            background: var(--accent-color);
            color: #fff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .search-box {
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        .search-in-wpr {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 18px;
            backdrop-filter: blur(20px);
            transition: all var(--transition-speed);
        }

        .search-in-wpr:focus-within {
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .search-icon {
            width: 18px;
            height: 18px;
            color: var(--accent-color);
            margin-right: 12px;
            opacity: 0.8;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
        }

        .gamegrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
        }

        .gcard {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            aspect-ratio: 0.85;
        }

        .gcard:hover {
            transform: translateY(-6px);
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }

        .gicon {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .gicon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .gcard:hover .gicon img {
            transform: scale(1.08);
        }

        .game-nm {
            padding: 12px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid var(--border-color);
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10000;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 10px;
            backdrop-filter: blur(20px);
            transition: all var(--transition-speed);
            color: #fff;
            font-weight: 500;
            font-size: 13px;
        }

        .back-btn:hover {
            background: #fff;
            color: #000;
            transform: scale(1.02);
        }

        #zoneFrame {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 9999;
            background: #000;
        }

        .empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 24px;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        .empty-state i {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Optimization: Skeleton loading */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <iframe id="zoneFrame"></iframe>
    <div id="closeGame" class="back-btn" style="display:none;" onclick="closeGame()">
        <i data-lucide="arrow-left"></i>
        <span>Back to Games</span>
    </div>

    <div class="gametainer">
        <div class="search-sec">
            <div class="prov-sel">
                <button class="prov-btn" onclick="loadProvider('ckv')" id="btn-ckv">CKV</button>
                <button class="prov-btn" onclick="loadProvider('hydra')" id="btn-hydra">Hydra</button>
                <button class="prov-btn" onclick="loadProvider('gnmath')" id="btn-gnmath">gn-math</button>
            </div>
            <div class="search-box">
                <div class="search-in-wpr">
                    <i data-lucide="search" class="search-icon"></i>
                    <input type="text" class="search-input" placeholder="Search games..." id="gameSearch">
                </div>
            </div>
        </div>
        
        <div class="gamegrid" id="gameGrid"></div>
        
        <div class="empty-state" id="emptyState">
            <i data-lucide="search-x"></i>
            <p>No games found matching your search</p>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let games = [];
        let fGames = [];
        let currProvider = localStorage.getItem('gravity_provider') || 'ckv';

        const COVER_URL = "https://cdn.jsdelivr.net/gh/gn-math/covers@main";
        const HTML_URL = "https://cdn.jsdelivr.net/gh/gn-math/html@main";
        const CKV_URL = "https://cdn.jsdelivr.net/gh/WanoCapy/ChickenKingsVault@main";
        const CKV_ICONS_URL = "https://raw.githubusercontent.com/carbonicality/ChickenKingsVault/main";
        const HYDRA_URL = "https://cdn.jsdelivr.net/gh/Hydra-Network/hydra-assets@main";

        // Listen for theme changes from parent
        window.addEventListener('message', (event) => {
            if (event.data.type === 'themeChange') {
                const colors = event.data.theme;
                for (const [key, value] of Object.entries(colors)) {
                    document.documentElement.style.setProperty(`--${key}`, value);
                }
            }
        });

        function showSkeleton() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = Array(12).fill(0).map(() => `
                <div class="gcard skeleton">
                    <div class="gicon"></div>
                    <div class="game-nm" style="height: 40px; background: rgba(255,255,255,0.05)"></div>
                </div>
            `).join('');
        }

        async function fetchGames() {
            showSkeleton();
            try {
                const res = await fetch("https://cdn.jsdelivr.net/gh/gn-math/assets@main/zones.json?t=" + Date.now());
                const gnMathZones = await res.json();
                games = gnMathZones
                    .filter(zone => zone.id !== -1 && zone.id !== 1 && zone.id !== 64)
                    .map(zone => ({
                        name: zone.name,
                        icon: zone.cover.replace("{COVER_URL}", COVER_URL).replace("{HTML_URL}", HTML_URL),
                        url: zone.url.replace("{HTML_URL}", HTML_URL).replace("{COVER_URL}", COVER_URL)
                    }));
                fGames = [...games];
                renderGames();
            } catch (e) {
                console.error("Failed to fetch gn-math games", e);
                renderGames();
            }
        }

        async function fetchCKVGames() {
            showSkeleton();
            try {
                const iconRes = await fetch(`${CKV_ICONS_URL}/games.json?t=${Date.now()}`);
                const iconJson = await iconRes.json();
                const iconMap = {};
                iconJson.forEach(g => {
                    iconMap[g.name.toLowerCase().replace(/[^a-z0-9]/g, '')] = `${CKV_ICONS_URL}/${g.img}`;
                });

                const res = await fetch(`https://api.github.com/repos/WanoCapy/ChickenKingsVault/contents/`);
                const json = await res.json();
                const htmlFiles = json.filter(f => f.type === 'file' && f.name.endsWith('.html') && f.name !== 'index.html');
                
                games = htmlFiles.map(f => {
                    const key = f.name.replace('.html', '').toLowerCase().replace(/[^a-z0-9]/g, '');
                    return {
                        name: f.name.replace('.html', ''),
                        icon: iconMap[key] || '',
                        url: `${CKV_URL}/${f.name}`
                    };
                });
                fGames = [...games];
                renderGames();
            } catch (e) {
                console.error("Failed to fetch CKV games", e);
                renderGames();
            }
        }

        async function fetchHydraGames() {
            showSkeleton();
            try {
                const res = await fetch(`${HYDRA_URL}/gmes.json?t=${Date.now()}`);
                const json = await res.json();
                games = json.map(g => ({
                    name: g.title,
                    icon: `${HYDRA_URL}/${g.thumb}`,
                    url: `${HYDRA_URL}/gmes/${g.file_name}`
                }));
                fGames = [...games];
                renderGames();
            } catch (e) {
                console.error("Failed to fetch Hydra games", e);
                renderGames();
            }
        }

        function loadProvider(provider) {
            currProvider = provider;
            localStorage.setItem('gravity_provider', provider);
            document.querySelectorAll('.prov-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('btn-' + provider);
            if (activeBtn) activeBtn.classList.add('active');
            
            if (provider === 'ckv') fetchCKVGames();
            else if (provider === 'hydra') fetchHydraGames();
            else fetchGames();
        }

        function renderGames() {
            const grid = document.getElementById('gameGrid');
            const empty = document.getElementById('emptyState');
            
            const fragment = document.createDocumentFragment();
            
            if (fGames.length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'flex';
            } else {
                empty.style.display = 'none';
                fGames.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'gcard';
                    card.innerHTML = `
                        <div class="gicon">
                            ${game.icon ? `<img src="${game.icon}" alt="${game.name}" loading="lazy" onerror="this.onerror=null;this.parentElement.innerHTML='<div style=\'font-size:24px;font-weight:bold;color:var(--accent-color);opacity:0.5\'>${game.name[0]}</div>'">` : `<div style="font-size:24px;font-weight:bold;color:var(--accent-color);opacity:0.5">${game.name[0]}</div>`}
                        </div>
                        <div class="game-nm">${game.name}</div>
                    `;
                    card.onclick = () => openGame(game);
                    fragment.appendChild(card);
                });
                grid.innerHTML = '';
                grid.appendChild(fragment);
            }
            lucide.createIcons();
        }

        function openGame(game) {
            const frame = document.getElementById('zoneFrame');
            const closeBtn = document.getElementById('closeGame');
            frame.style.display = 'block';
            closeBtn.style.display = 'flex';
            frame.src = game.url;
            document.body.style.overflow = 'hidden';
        }

        function closeGame() {
            const frame = document.getElementById('zoneFrame');
            const closeBtn = document.getElementById('closeGame');
            frame.style.display = 'none';
            closeBtn.style.display = 'none';
            frame.src = 'about:blank';
            document.body.style.overflow = 'auto';
        }

        const searchInput = document.getElementById('gameSearch');
        let searchTimeout;
        searchInput.oninput = (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const query = e.target.value.toLowerCase().trim();
                fGames = games.filter(g => g.name.toLowerCase().includes(query));
                renderGames();
            }, 150);
        };

        // Initialize with saved provider
        loadProvider(currProvider);
    </script>
</body>
</html>
