<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Assistant - gravityOS</title>
    <style>
        :root {
            --bg-color: transparent;
            --text-color: white;
            --card-bg: rgba(255, 255, 255, 0.05);
            --accent-color: #3b82f6;
        }
        body {
            margin: 0;
            padding: 40px;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .header-wpr {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        #chat-container {
            flex: 1;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            overflow-y: auto;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            padding: 14px 20px;
            border-radius: 18px;
            max-width: 75%;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-message {
            background: var(--accent-color);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .ai-message {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        #input-container {
            display: flex;
            gap: 12px;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        #ai-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 12px 18px;
            outline: none;
            font-size: 14px;
        }
        #send-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        #send-btn:hover {
            transform: scale(1.05);
        }
        .typing {
            font-size: 12px;
            opacity: 0.5;
            margin-left: 10px;
            display: none;
            margin-bottom: 10px;
        }
        .stats {
            font-size: 12px;
            opacity: 0.6;
            display: flex;
            gap: 15px;
        }
        .settings-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #settings-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 24px;
            z-index: 1000;
            width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
        }
        .key-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            outline: none;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header-wpr">
        <h1 style="margin: 0; font-weight: 700; letter-spacing: -0.02em;">AI Assistant</h1>
        <div class="stats">
            <span id="req-count">Requests: 0/40</span>
        </div>
    </div>

    <div id="chat-container">
        <div class="message ai-message">Hello! I'm your gravityOS assistant. How can I help you today?</div>
    </div>
    <div class="typing" id="typing-indicator">AI is thinking...</div>
    <div id="input-container">
        <input type="text" id="ai-input" placeholder="Ask me anything...">
        <button id="send-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
    </div>

    <div class="modal-overlay" id="overlay" onclick="closeSettings()"></div>
    <div id="settings-modal">
        <h2 style="margin-top:0; font-size:1.2rem;">API Key Settings</h2>
        <p style="font-size:0.8rem; opacity:0.6; margin-bottom:20px;">Add up to 4 Gemini API keys. The system will rotate through them.</p>
        <input type="password" class="key-input" id="key-1" placeholder="API Key 1">
        <input type="password" class="key-input" id="key-2" placeholder="API Key 2">
        <input type="password" class="key-input" id="key-3" placeholder="API Key 3">
        <input type="password" class="key-input" id="key-4" placeholder="API Key 4">
        <button onclick="saveSettings()" style="width:100%; padding:12px; background:var(--accent-color); color:white; border:none; border-radius:10px; cursor:pointer; font-weight:600;">Save Settings</button>
    </div>

    <script type="module">
        (function() {
            const savedTheme = localStorage.getItem('gravity_theme');
            if (savedTheme) {
                try {
                    const theme = JSON.parse(savedTheme);
                    for (const [key, value] of Object.entries(theme.colors)) {
                        document.documentElement.style.setProperty(`--${key}`, value);
                    }
                } catch (e) {
                    console.error('Failed to apply initial theme to ai:', e);
                }
            }
        })();

        window.addEventListener('message', (event) => {
            if (event.data.type === 'themeChange') {
                const colors = event.data.theme;
                for (const [key, value] of Object.entries(colors)) {
                    document.documentElement.style.setProperty(`--${key}`, value);
                }
            }
        });

        const input = document.getElementById('ai-input');
        const btn = document.getElementById('send-btn');
        const container = document.getElementById('chat-container');
        const typing = document.getElementById('typing-indicator');
        const reqCountEl = document.getElementById('req-count');

        let requests = parseInt(localStorage.getItem('ai_requests') || '0');
        const MAX_REQUESTS = 40;

        function updateReqCount() {
            reqCountEl.innerText = `Requests: ${requests}/${MAX_REQUESTS}`;
            localStorage.setItem('ai_requests', requests);
        }
        updateReqCount();

        function openSettings() {
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('settings-modal').style.display = 'block';
            
            const keys = JSON.parse(localStorage.getItem('ai_keys') || '[]');
            keys.forEach((key, i) => {
                const el = document.getElementById(`key-${i+1}`);
                if (el) el.value = key;
            });
        }
        window.openSettings = openSettings;

        function closeSettings() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('settings-modal').style.display = 'none';
        }
        window.closeSettings = closeSettings;

        function saveSettings() {
            const keys = [];
            for (let i = 1; i <= 4; i++) {
                const val = document.getElementById(`key-${i}`).value;
                if (val) keys.push(val);
            }
            localStorage.setItem('ai_keys', JSON.stringify(keys));
            closeSettings();
        }
        window.saveSettings = saveSettings;

        function getApiKey() {
            const userKeys = JSON.parse(localStorage.getItem('ai_keys') || '[]');
            if (userKeys.length > 0) {
                // Rotate through user keys
                const index = requests % userKeys.length;
                return userKeys[index];
            }
            return process.env.GEMINI_API_KEY;
        }

        function addMessage(text, isUser) {
            const msg = document.createElement('div');
            msg.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            msg.innerText = text;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }

        btn.onclick = async () => {
            const text = input.value;
            if (!text) return;

            if (requests >= MAX_REQUESTS) {
                addMessage("You've reached your limit of 40 requests. Please try again later.", false);
                return;
            }

            addMessage(text, true);
            input.value = '';
            
            typing.style.display = 'block';
            
            try {
                const response = await fetch('/api/ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || "Failed to get AI response");
                }

                typing.style.display = 'none';
                
                // Create a new message bubble for the stream
                const msg = document.createElement('div');
                msg.className = 'message ai-message';
                container.appendChild(msg);
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    fullText += chunk;
                    msg.innerText = fullText;
                    container.scrollTop = container.scrollHeight;
                }
                
                requests++;
                updateReqCount();
            } catch (e) {
                typing.style.display = 'none';
                console.error("AI Error:", e);
                addMessage("Error: " + e.message, false);
            }
        };

        input.onkeydown = (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                btn.click();
            }
        };
    </script>
</body>
</html>
