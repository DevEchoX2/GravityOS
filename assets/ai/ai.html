<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Assistant | gravityOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="ai.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.1.0/font/lucide.css">
</head>
<body class="bg-transparent text-white p-12 h-screen flex flex-col">
    <div class="max-w-4xl mx-auto w-full flex-1 flex flex-col space-y-8">
        <header class="text-center">
            <h1 class="text-4xl font-black uppercase tracking-tighter">Gravity <span class="text-emerald-500">AI</span></h1>
            <p class="text-white/40 text-sm">Powered by Gemini 3.1 Pro</p>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto space-y-6 pr-4 no-scrollbar">
            <div class="ai-message">
                Hello! I'm your gravityOS assistant. How can I help you today?
            </div>
        </div>

        <div class="relative group">
            <div class="absolute inset-y-0 left-6 flex items-center pointer-events-none text-white/20 group-focus-within:text-emerald-500 transition-colors">
                <i class="lucide-sparkles"></i>
            </div>
            <input type="text" id="ai-input" placeholder="Ask anything..." 
                class="w-full bg-white/5 border border-white/10 rounded-2xl py-6 pl-16 pr-24 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 transition-all">
            <button id="send-btn" class="absolute right-4 top-1/2 -translate-y-1/2 bg-emerald-500 text-black px-6 py-2 rounded-xl font-bold hover:bg-emerald-400 transition-colors">
                Send
            </button>
        </div>
    </div>

    <script src="ai.js"></script>
</body>
</html>
